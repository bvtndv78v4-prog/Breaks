<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f1;--surf:#fff;--surf2:#f4f7f6;--ink:#10201f;--mut:#566866;--line:#d6dfdd;--pine:#0e5c55;--on:#fff;--mint:#dcefea;--glow:#ffb020;--ring:#b45309;--sh1:0 1px 2px rgb(10 40 36/.05),0 8px 24px rgb(10 40 36/.06);color-scheme:light}
:root[data-theme=dark]{--bg:#0b1312;--surf:#111c1b;--surf2:#152322;--ink:#e5f0ee;--mut:#8fa5a2;--line:#233634;--pine:#5fd1c2;--on:#04201c;--mint:#163532;--ring:#ffc27a;--sh1:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.25);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 "IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3,.brand,.bt,.tr>b{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:900px;margin:auto;padding:0 18px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.brand{display:flex;gap:11px;align-items:center;font-weight:600;font-size:1.05rem}
.mark{width:36px;height:36px;border-radius:11px;background:var(--pine);color:var(--on);display:grid;place-items:center}
.mark .ic{width:19px;height:19px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{border-color:var(--pine);background:var(--mint)}
.i-sun{display:none}:root[data-theme=dark] .i-sun{display:block}:root[data-theme=dark] .i-moon{display:none}

/* intro */
.intro{padding:22px 0 12px}
.intro h1{margin:0 0 12px;font-size:clamp(1.55rem,5vw,2.3rem);line-height:1.35;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.stats li{padding:3px 13px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-size:.9rem;color:var(--mut)}
.stats li b{color:var(--ink);font-weight:600}
.stats li.warn{background:var(--glow);border-color:var(--glow);color:#2a1a00}

/* sticky search */
.finder{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:10px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sb{position:relative}
.sb input{height:54px;padding-inline:50px 18px;font-size:1.05rem;border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--sh1);-webkit-appearance:none;appearance:none}
.sb input:focus,.sb input:focus-visible{outline:none;border-color:var(--pine);box-shadow:0 0 0 4px color-mix(in srgb,var(--pine) 20%,transparent)}
.sb .ic{position:absolute;inset-inline-start:17px;top:50%;translate:0 -50%;color:var(--mut);width:21px;height:21px;pointer-events:none}

input,select{font:inherit;width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink)}
input:focus,select:focus{border-color:var(--pine)}
input[type=file]{height:auto;padding:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pine)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pine);color:var(--on);border-color:var(--pine)}
.btn.rm:hover{border-color:#c0392b;color:#c0392b}

/* panel + filters */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh1);overflow:hidden}
.pnh{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.sg{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center}
.sg small{color:var(--mut);margin-inline-start:6px;font-size:.8rem}
.sg:hover{border-color:var(--pine)}
.sg[aria-pressed=true]{background:var(--pine);color:var(--on);border-color:var(--pine)}
.sg[aria-pressed=true] small{color:inherit;opacity:.85}
#vseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surf2);border:1px solid var(--line);border-radius:14px}
#vseg .sg{height:40px;border:0;border-radius:10px;background:transparent;justify-content:center}
#vseg .sg[aria-pressed=true]{background:var(--pine);color:var(--on)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{color:var(--mut);margin:0;font-size:.95rem}
#mseg{gap:6px;align-items:center}
#mseg .sg{height:30px;padding:0 11px;font-size:.82rem}
.ml{color:var(--mut);font-size:.82rem;margin-inline-end:2px}

/* person row */
.p{display:grid;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 120px}
.p:last-child{border-bottom:0}
.p:hover{background:var(--surf2)}
.p h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:1px 11px;border-radius:99px;font-size:.82rem;border:1px solid var(--line);color:var(--mut)}
.chip.s{background:var(--mint);border-color:transparent;color:var(--pine)}
.loc{display:flex;gap:7px;color:var(--mut);font-size:.88rem;margin-top:8px}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bt{display:inline-flex;align-items:baseline;gap:6px;padding:6px 13px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);font-size:1.02rem;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.bt small{font:400 .78rem "IBM Plex Sans Arabic",sans-serif;color:var(--mut)}
.bt.past{opacity:.45}
.bt.nx{background:var(--glow);border-color:var(--glow);color:#2a1a00}
.bt.nx small{color:#2a1a00;opacity:.75}
.bt.nx::before{content:attr(data-nx);font:500 .72rem "IBM Plex Sans Arabic",sans-serif;padding:0 7px;border-radius:99px;background:#2a1a00;color:#ffe3a6;align-self:center;unicode-bidi:isolate}
.tm{display:grid;gap:6px;justify-items:start;min-width:150px}
.act{display:flex;gap:8px;flex-wrap:wrap}.act .btn{height:38px;padding:0 13px}
.hrw{display:flex;gap:6px;align-items:center}.hri{width:130px;height:38px}

/* full table view */
.tr{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:start}
.tr>b{font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600;padding-top:2px}
.tg{display:grid;gap:8px;min-width:0}.tg small{color:var(--mut)}

.note{padding:22px 20px;color:var(--mut);text-align:center}
.more{display:flex;justify-content:center;padding:16px}
.foot{padding:30px 0 22px;margin:0}

/* admin */
.side{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:0 18px;margin-top:20px;box-shadow:var(--sh1)}
.side summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.side summary::-webkit-details-marker{display:none}
.side summary>span{display:flex;align-items:center;gap:8px}
.side[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
.side .cv{transition:transform .25s;color:var(--mut)}[dir=ltr] .side .cv{transform:scaleX(-1)}.side[open] .cv{transform:rotate(-90deg)}
.hint{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--mint);color:var(--pine);font-size:.92rem}
.hint.err{background:#fbe4e0;color:#8a2a1c}:root[data-theme=dark] .hint.err{background:#3a1e1a;color:#ffb4a5}
.f label{display:block;font-size:.82rem;color:var(--mut);margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-bottom:12px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.dv{border:0;border-top:1px solid var(--line);margin:18px 0}
.ah{margin:6px 0 12px;font-size:1.05rem}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;color:var(--mut)}.chk input{width:auto;height:auto}

@media (min-width:700px){.p{grid-template-columns:1fr auto;align-items:center}.act{flex-direction:column;align-items:stretch;min-width:124px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top .tools{display:flex;gap:8px;align-items:center}
.ibtn.tl{width:auto;min-width:40px;padding:0 11px;font:600 .82rem "IBM Plex Sans Arabic",system-ui,sans-serif}
.side.sub{box-shadow:none;background:var(--surf2);margin:14px 0}
.ebx{display:grid;gap:10px;margin-top:12px}
.ebr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ebr .ebt{width:132px;height:42px}
.ebd{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:.88rem}
.ebr .ebm{width:78px;height:42px}
.ebr .btn.rm{width:42px;height:42px;padding:0;font-size:1.25rem;line-height:1}
.ebx .tb{margin:2px 0 0}

/* ---------- sha-256 (works on plain http too) ---------- */
const K=[],H0=[];
(()=>{let n=2,c=0;while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p){if(c<8)H0[c]=Math.floor((Math.sqrt(n)%1)*4294967296);K[c]=Math.floor((Math.cbrt(n)%1)*4294967296);c++}n++}})();
function sha256(by){
  const l=by.length,nb=((l+8)>>6)+1,W=new Uint32Array(nb*16),w=new Uint32Array(64);
  for(let i=0;i<l;i++)W[i>>2]|=by[i]<<(24-8*(i&3));
  W[l>>2]|=0x80<<(24-8*(l&3));W[nb*16-1]=l*8;
  let h=H0.slice();
  for(let k=0;k<nb;k++){
    for(let i=0;i<16;i++)w[i]=W[k*16+i];
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))>>>0}
    let [a,b,c,d,e,f,g,q]=h;
    for(let i=0;i<64;i++){
      const t1=(q+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c)))>>>0;
      q=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h=[h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+q].map(x=>x>>>0);
  }
  const o=new Uint8Array(32);h.forEach((x,i)=>{o[4*i]=x>>>24;o[4*i+1]=(x>>>16)&255;o[4*i+2]=(x>>>8)&255;o[4*i+3]=x&255});return o;
}
const u8=s=>new TextEncoder().encode(s),hx=a=>[...a].map(x=>x.toString(16).padStart(2,'0')).join(''),unh=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));

function kdf(pw,saltHex){const s=unh(saltHex);let d=sha256(cat(s,u8(pw)));for(let i=0;i<20000;i++)d=sha256(cat(d,s));return hx(d)}

    cd.push(Uint8Array.from(c),nb);

  for(let g=0;g<NG;g++)for(let k=0;k<256;k++){const c=B.cnt[g*256+k];if(exg[g]){if(c>1)ex++}else if(c===2)h2++;else if(c>2)h3++}
  const f=T=>String((T%1440)/60|0).padStart(2,'0')+':'+String(T%60).padStart(2,'0');
  return{rows:rows.map(r=>[f(r[0]),r[1],r[2],r[3]]),base:base===1e9?0:base,n:A.length,skip,ex,h2,h3,relaxed};
}

function rosterFrom(rows){
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim()));if(hi<0)throw new Error(_t('errEmpty'));
  const H=rows[hi].map(nz),fi=re=>H.findIndex(h=>h&&re.test(h));
  const ci={n:fi(/^name|اسم|^agent|employee name|موظف/),h:fi(/(^|[^a-z])hr([^a-z]|$)|code|كود|رقم|employee id|^id$/),i:fi(/^in(\s|$)|دخول|بدايه|start/),o:fi(/^out(\s|$)|خروج|نهايه|end/),g:fi(/group|مجموع|قسم|team|project/)};
  if(ci.n<0)throw new Error(_t('errName'));
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const g=k=>ci[k]>=0?String(r[ci[k]]??'').trim().replace(/\s+/g,' '):'';
    const n=g('n');if(!n)return;
    let a=ci.i>=0?tm(r[ci.i]):'',b=ci.o>=0?tm(r[ci.o]):'';
    if(!a||!b){const m=/(\d{1,2}:\d{2})\s*[-\u2013\u2014]\s*(\d{1,2}:\d{2})/.exec(r.join(' '));if(m){a=tm(m[1]);b=tm(m[2])}}
    out.push([n,g('h'),a,b,g('g')]);
  });
  return out;
}
function mergeRoster(list){

  return[up,ad];
}
function runGen(list,pre){
  const dv=$('#gd'),date=(dv&&dv.value)||GD||today();GD=date;
  const R=genBreaks(list.map(r=>({n:r[0],g:r[4],a:r[2],b:r[3]})));

  D.b={date,base:R.base,r:R.rows};eb=null;touch();upd();
  const p=[(pre||'')+_t('genDone',date,R.rows.length,R.n)];
  if(R.skip)p.push(_t('genSkip',R.skip));
  p.push(R.ex?_t('genEx',R.ex):_t('genNoEx'));
  p.push(R.h2||R.h3?_t('genHot',R.h2,R.h3):_t('genHotNone'));

  if(!SRV)p.push(_t('remind'));

}

const b64=t=>{const u=new TextEncoder().encode(t);let o='';for(let i=0;i<u.length;i+=0x8000)o+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(o)};
async function ghPublish(){
  const base=GH.api||'https://api.github.com',url=`${base}/repos/${encodeURIComponent(GH.o)}/${encodeURIComponent(GH.r)}/contents/data.json`;
  const H={'Authorization':'Bearer '+GH.t,'Accept':'application/vnd.github+json'};
  D.u=new Date().toISOString();const body=b64(JSON.stringify(D));
  for(let i=0;i<3;i++){
    let sha;const g=await fetch(url+'?t='+Date.now(),{headers:H,cache:'no-store'});

    const r=await fetch(url,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:'Update break schedule',content:body,...(sha?{sha}:{})})});
